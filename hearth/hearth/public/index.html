<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hearth</title>
<style>
:root{--bg:#1a1b1f;--bg2:#222328;--bg3:#2b2d33;--tx:#e8e9ee;--mu:#9a9ca8;--ac:#5865f2}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100vh}
button,input{font:inherit;color:inherit}button{background:var(--ac);border:0;border-radius:6px;padding:8px 14px;cursor:pointer}button.g{background:var(--bg3)}
input{background:var(--bg);border:1px solid #3a3c44;border-radius:6px;padding:10px;width:100%}
#authwrap{--ac:#ff6b35;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 120%,#ff6b3533,transparent 60%),repeating-linear-gradient(0deg,#ff6b3510 0 1px,transparent 1px 48px),repeating-linear-gradient(90deg,#ff6b3510 0 1px,transparent 1px 48px),#0f0f12}
#auth{width:min(420px,100%);background:#17171b;border:1px solid #2a2a31;border-radius:18px;padding:32px 30px;display:grid;gap:8px;text-align:center;box-shadow:0 20px 60px #0008}
#auth .alogo{font-size:22px;font-weight:800}#auth h1{margin:14px 0 0;font-size:28px}.mu{color:var(--mu);margin:0 0 14px}
#auth label{text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;color:#c9c9d1;margin-top:8px}#auth input{background:#101013;padding:12px}
#auth input:focus{outline:2px solid var(--ac);border-color:transparent}.pw{position:relative}.pw .eye{position:absolute;right:4px;top:4px;background:none;padding:8px}
#auth .go{background:var(--ac);font-weight:700;padding:13px;margin-top:10px;box-shadow:0 8px 24px #ff6b3540}#auth .go:disabled{opacity:.6}
.sw{margin-top:8px;color:var(--mu)}.sw a{color:var(--ac);font-weight:700;text-decoration:none}
#app{display:grid;grid-template-columns:72px 230px 1fr;height:100vh}#side{overflow:auto}#side{background:var(--bg2);display:flex;flex-direction:column;padding:10px}
.ch{padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--mu)}.ch.on,.ch:hover{background:var(--bg3);color:var(--tx)}
#me{margin-top:auto;padding:10px;border-radius:8px;display:flex;gap:6px;align-items:center;justify-content:space-between}
#main{display:flex;flex-direction:column;min-width:0}#msgs{flex:1;overflow:auto;padding:12px 18px}
.m{display:flex;gap:12px;padding:6px 0}.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none}
.nm{font-weight:600}.bd{font-size:11px;background:var(--bg3);border-radius:4px;padding:1px 5px;margin-left:4px}.ts{font-size:11px;color:var(--mu);margin-left:6px}
.x{margin-left:8px;background:none;color:#f66;padding:0;font-size:12px}
#bar{display:flex;gap:8px;padding:12px 18px;position:relative}#emo{position:absolute;bottom:62px;right:18px;background:var(--bg2);padding:8px;border-radius:8px;display:none;grid-template-columns:repeat(8,1fr);gap:2px;border:1px solid #3a3c44}
#emo span{cursor:pointer;font-size:22px;padding:3px}#modal{position:fixed;inset:0;background:#000a;display:none;place-items:center}
#modal>div{background:var(--bg2);padding:20px;border-radius:12px;width:min(560px,94vw);max-height:80vh;overflow:auto;display:grid;gap:10px}
.th{width:60px;height:36px;border-radius:6px;display:inline-block;margin:3px;cursor:pointer;border:2px solid transparent}.th.on{border-color:#fff}
.err{color:#f77}@media(max-width:640px){#app{grid-template-columns:56px 140px 1fr}}
#rail{background:#141518;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0;overflow:auto}
.rb{width:46px;height:46px;border-radius:50%;background:var(--bg3);display:grid;place-items:center;cursor:pointer;font-weight:700;flex:none}.rb.on,.rb:hover{border-radius:14px;background:var(--ac)}
#top{padding:12px 18px;font-weight:700;border-bottom:1px solid #0004}.av{overflow:hidden}.ai{width:100%;height:100%;object-fit:cover}
.vc{background:var(--bg3);padding:8px;border-radius:8px;margin-top:8px;display:grid;gap:6px;font-size:13px}#side input{margin:6px 0}#side h3,#side h4{margin:8px 4px}
</style></head><body><div id="root"></div><script src="/app.js"></script></body></html>
